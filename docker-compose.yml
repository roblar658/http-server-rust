services:
  server:
    build:
      context: .
      target: server
    container_name: rust-http-server
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s

  client:
    build:
      context: .
      target: client
    container_name: rust-http-client
    environment:
      - SERVER_URL=http://server:8080
    depends_on:
      server:
        condition: service_healthy
